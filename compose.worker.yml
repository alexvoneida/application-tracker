services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    env_file: .env.worker
    volumes:
      - worker-data:/data
      - ./fieldwork-worker.json:/config/fieldwork-worker.json:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  worker-data:
